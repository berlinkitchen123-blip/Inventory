name: Fetch NRW Stock from Apicbase
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch-stock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch NRW stock and update stock-patch.json
        env:
          APICBASE_TOKEN: ${{ secrets.APICBASE_TOKEN }}
        run: python scripts/fetch_nrw_stock.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/stock-patch.json
          git diff --cached --quiet || (git commit -m "Update NRW stock from Apicbase $(date -u +%F)" && git push)
