name: Refresh data from BB database

on:
  schedule:
    - cron: "0 5 * * *"   # once a day at 05:00 UTC (06:00 Germany)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pymysql==1.1.1
      - name: Export NRW menus and recipes
        run: python scripts/export_data.py
        env:
          DBDATA: ${{ secrets.DBDATA }}
      - name: Save the new data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/db-snapshot.json
          git diff --cached --quiet || (git commit -m "Refresh NRW data $(date -u +%F)" && git push)
