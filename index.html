<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NRW Stock Planner</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%93%A6%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#121a17;--panel:#18231f;--panel-2:#1f2e28;--line:#2c3c36;--ink:#eef2ec;--ink-2:#aab9b1;--ink-3:#84958c;--saffron:#f0b541;--paprika:#ec8f74;--herb:#8fc9a3;color-scheme:dark;font-family:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-size:15px;line-height:1.45}
.wrap{max-width:1180px;margin:0 auto;padding:22px 16px 72px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--saffron);outline-offset:2px}
.top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:4px 24px;margin-bottom:18px}
.top p{margin:2px 0 0}
h1{margin:0;font-size:26px;font-weight:800;letter-spacing:-.02em}
.muted{color:var(--ink-2)}.small{font-size:13px}
.error{background:#3a1f19;border:1px solid var(--paprika);padding:10px 12px;border-radius:8px}
.weekbar{display:grid;grid-template-columns:auto 1fr auto;align-items:stretch;gap:10px}
.nav{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:0 16px;font-size:22px;font-weight:800;color:var(--ink-2)}
.nav:hover{border-color:var(--saffron);color:var(--ink)}
.ticket{position:relative;display:flex;flex-direction:column;background:var(--panel-2);border:1px solid var(--saffron);border-radius:14px;padding:16px 28px 16px 22px;overflow:hidden}
.ticket::before{content:"";position:absolute;top:0;bottom:0;left:0;width:6px;background:var(--saffron)}
.ticket::after{content:"";position:absolute;top:0;right:0;bottom:0;width:10px;background:radial-gradient(circle at 10px 9px,var(--bg) 4px,transparent 4.5px) 0 0/10px 18px repeat-y}
.ticket .kind{font-size:13px;font-weight:600;color:var(--ink-2)}
.ticket .date{font-size:clamp(28px,5.5vw,44px);font-weight:800;letter-spacing:-.035em;line-height:1.05;margin:4px 0 6px}
.ticket .cover{font-size:14px;color:var(--ink-2)}
.ticket .menu{font-size:13px;color:var(--herb);margin-top:4px}
.ticket .menu.warn{color:var(--paprika)}
.weeks{display:flex;gap:6px;margin-top:10px;overflow-x:auto;padding-bottom:2px}
.wk{flex:0 0 auto;display:flex;flex-direction:column;align-items:flex-start;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-size:12.5px;color:var(--ink-2);text-align:left}
.wk b{font-size:14px;color:var(--ink)}
.wk[aria-current="true"]{border-color:var(--saffron);background:var(--panel-2)}
.wk .ok{color:var(--herb)}.wk .no{color:var(--ink-3)}
details.settings{margin-top:14px;border:1px solid var(--line);border-radius:10px;padding:10px 14px;background:var(--panel)}
details.settings summary{cursor:pointer;font-weight:600}
.settings-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-top:12px}
.settings-grid label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--ink-2)}
.settings-grid input{width:120px}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:18px 0 14px;overflow-x:auto}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;margin-bottom:-1px;padding:10px 14px;font-weight:600;color:var(--ink-2);white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--saffron)}
.toolbar{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px 16px;margin-bottom:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:13px;color:var(--ink-2);background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:3px 10px}
.actions{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.toggle{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--ink-2)}
.btn{background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:8px 13px;font-weight:600}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--saffron);border-color:var(--saffron);color:#1c1504}
.btn.tiny{padding:3px 9px;font-size:12.5px;margin-top:6px}
input[type=search],input[type=number],select{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 9px}
input[type=search]{min-width:220px}
input[type=number]{width:84px;text-align:right;font-variant-numeric:tabular-nums}
input[type=number]:disabled{opacity:.4}
input[type=checkbox]{width:18px;height:18px;accent-color:var(--saffron)}
.fc input[type=number]{width:66px;padding:6px 7px}
.fc td.day,.fc th.day{text-align:center}
.fc td.nomenu{color:var(--ink-3);text-align:center}
.fc tr.group td{background:var(--panel);font-size:12px;font-weight:700;color:var(--ink-3);text-transform:uppercase;letter-spacing:.04em}
.sup{margin-top:24px}
.sup h2{margin:0 0 8px;font-size:19px;font-weight:800;display:flex;align-items:baseline;gap:10px}
.sup h2 .count{font-size:13px;font-weight:600;color:var(--ink-3)}
.sup.none h2{color:var(--paprika)}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:8px 10px;text-align:left;vertical-align:top}
thead th{background:var(--panel);font-size:12px;font-weight:600;color:var(--ink-3);white-space:nowrap}
td.num,th.num{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
table.order{min-width:900px}
table.order tbody.item{border-top:1px solid var(--line)}
table.order .item-cell{width:30%;font-weight:400}
table.order tr.total td{font-weight:600}
table.order tr.dish td{padding-top:3px;padding-bottom:3px;font-size:13px;color:var(--ink-2)}
table.order tr.dish:last-child td{padding-bottom:10px}
.name{font-weight:700}
.note{font-size:12.5px;color:var(--ink-2);margin-top:2px}
.tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.tag{display:inline-block;font-size:11.5px;font-weight:600;padding:1px 7px;border-radius:5px;border:1px solid currentColor}
.tag.est{color:var(--paprika)}.tag.ok{color:var(--herb)}.tag.db{color:var(--ink-3)}.tag.fresh{color:var(--herb)}
.suppick{display:flex;align-items:center;gap:6px;margin-top:6px;font-size:12.5px;color:var(--ink-3)}
.suppick select{padding:4px 6px;font-size:13px;max-width:200px}
.qty{font-size:16px;font-weight:800}
.num small{font-size:12px;font-weight:600;color:var(--ink-2);margin-left:3px}
.empty{color:var(--ink-2);padding:24px 0;max-width:70ch}
.lead{color:var(--ink-2);max-width:80ch}
table.plain th,table.plain td{border-top:1px solid var(--line)}
table.plain thead th{border-top:0}
tfoot td{font-weight:800}
.warn{color:var(--paprika)}
.h2{font-size:17px;font-weight:800;margin:22px 0 6px}
.checks{margin:0;padding-left:20px;max-width:80ch}
.checks li{margin:6px 0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
code{background:var(--panel-2);padding:1px 5px;border-radius:4px}
.print-title{display:none}
@media (max-width:720px){
  .weekbar{grid-template-columns:44px 1fr 44px}
  .nav{padding:0}
  input[type=search]{min-width:0;flex:1}
  .actions{width:100%}
}
@media print{
  :root{color-scheme:light}
  html,body{background:#fff;color:#000}
  .weekbar,.weeks,.tabs,.settings,.actions,#freshness,#p-forecast,#p-yields,#p-checks{display:none!important}
  .print-title{display:block;font-size:18px;margin:0 0 8px}
  .tablewrap{overflow:visible;border-color:#bbb}
  table.order{min-width:0}
  tbody.item{break-inside:avoid;border-color:#bbb!important}
  thead th{background:none}
  .muted,.note,.num small,.count,.chip,.tag,thead th,table.order tr.dish td,.suppick{color:#333!important}
  .chip{border-color:#bbb;background:none}
  input,select{border:0!important;background:none!important;color:#000!important;padding:0;appearance:none}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1>NRW Stock Planner</h1>
      <p class="muted small" id="kitchen"></p>

  <p class="error" id="appError" role="alert" hidden></p>

    <button role="tab" id="t-yields" data-tab="yields" aria-controls="p-yields">Yields</button>
    <button role="tab" id="t-checks" data-tab="checks" aria-controls="p-checks">Checks</button>
  </nav>
  <main>
    <section id="p-forecast" role="tabpanel" aria-labelledby="t-forecast"></section>
    <section id="p-order" role="tabpanel" aria-labelledby="t-order" hidden>
      <h2 class="print-title" id="printTitle"></h2>
      <div class="toolbar">
        <div class="chips" id="chips"></div>
        <div class="actions">
          <input type="search" id="search" placeholder="Find item or dish" aria-label="Find item or dish">
          <label class="toggle"><input type="checkbox" id="showDishes" data-fid="showDishes"> Show dishes</label>
          <button class="btn" id="xlsxBtn">Download Excel</button>
          <button class="btn primary" id="printBtn">Print order</button>
        </div>
      </div>
      <div id="orderList"></div>
    </section>
    <section id="p-yields" role="tabpanel" aria-labelledby="t-yields" hidden></section>
    <section id="p-checks" role="tabpanel" aria-labelledby="t-checks" hidden></section>
  </main>
</div>

<script>
/*CORE-START*/
const WATER = /^(\[i\]\s*)?water$/i;
const FRESH = 'Fresh veg, fruit & herbs';
const NO_SUPPLIER = 'No supplier yet';
const TYPE_ORDER = ['LC', 'SB', 'CI', 'SW', 'HE', 'AD'];

function pick(...vals) {
  for (const v of vals) if (v !== undefined && v !== null && v !== '' && Number.isFinite(+v)) return +v;
  return 0;
}

function ruleGroup(info) {
  const c = String((info && info.cat) || '').toLowerCase(), t = String((info && info.type) || '').toLowerCase();
  if (/meat|fish/.test(c)) return 'Meat & fish';
  if (c.includes('vegan protein')) return 'Vegan protein';
  if (c.includes('dairy')) return 'Dairy & eggs';
  if (c.includes('dressing')) return 'Sauces & dressings';
  if (c.includes('ready made') || t.includes('ready made')) return 'Ready-made components';
  if (c.includes('bread')) return 'Bread';
  if (t.includes('frozen')) return 'Frozen veg';
  if (c.includes('canned')) return 'Dry & canned';
  if (/vegetable|fruit/.test(c) || t.includes('produce')) return FRESH;
  if (/dry|grain|pasta/.test(c) || t === 'dry') return 'Dry goods';
  if (c.includes('spice')) return 'Oils, spices & condiments';
  return 'Other';
}

// Yield = cooked grams one batch gives. Order: your edit > settings file > DB > batch input weight.
function yieldInfo(name, db, set, st) {
  const s = db.subs[name] || {}, y = (set.yields || {})[name], why = (y && y.why) || '';
  const local = (st.yields || {})[name];
  if (pick(local) > 0) return { value: pick(local), source: 'confirmed', why };
  if (y && pick(y.yield) > 0) return { value: pick(y.yield), source: y.confirmed ? 'confirmed' : 'estimate', why };
  if (pick(s.dbYield) > 0) return { value: pick(s.dbYield), source: 'db', why };
  return { value: pick(s.input), source: 'input', why };
}

// NRW menus of one week, day by day (days = 'YYYY-MM-DD', Mon..Fri). A dish can be on some days only.
function weekMenu(db, days) {
  const first = days[0], last = days[days.length - 1];
  const menus = (db.menus || []).filter(m => m.from <= last && m.to >= first);
  const onDay = days.map(d => new Set(menus.filter(m => m.from <= d && d <= m.to).flatMap(m => m.dishes).filter(id => db.dishes[id])));
  const rank = t => { const i = TYPE_ORDER.indexOf(t); return i < 0 ? TYPE_ORDER.length : i; };
  const ids = [...new Set(onDay.flatMap(s => [...s]))]
    .sort((a, b) => rank(db.dishes[a].type) - rank(db.dishes[b].type) || db.dishes[a].name.localeCompare(db.dishes[b].name));
  return { menus, onDay, ids };
}

// Order need for one week = forecast portions x recipe, plus buffer, minus stock counted for that week.
function computePlan(db, set, st, week) {
  const wm = weekMenu(db, week.days), fc = st.fc || {};
  const dishes = wm.ids.map(id => {
    const d = db.dishes[id];
    const perDay = week.days.map((day, i) => wm.onDay[i].has(id) ? pick((fc[day] || {})[id]) : null); // null = not on that day's menu
    const lineG = (db.lines[id] || []).reduce((a, l) => a + (l[3] === 'g' || l[3] === 'ml' ? pick(l[2]) : 0), 0);
    return { id, name: d.name, type: d.type, perDay, portions: perDay.reduce((a, v) => a + (v || 0), 0), noRecipe: !(db.lines[id] || []).length,
      incomplete: pick(d.portion) > 0 && lineG > 0 && lineG < 0.5 * pick(d.portion), lineG, portion: pick(d.portion) }; // recipe lines < half the dish weight
  });
  const buf = pick(st.buffer, set.buffer);
  const byDish = {}, units = {}, cooked = {}, est = {}, usedIn = {};
  const add = (dish, name, qty, unit, flag) => {
    const key = unit === 'pcs' ? name + ' (pcs)' : name;
    const m = byDish[key] = byDish[key] || {};
    m[dish] = (m[dish] || 0) + qty;
    (units[key] = units[key] || {})[unit] = true;
    if (flag) est[key] = true;
  };
  const explode = (dish, sub, qty, depth, flag) => {
    cooked[sub] = (cooked[sub] || 0) + qty;
    const s = db.subs[sub], y = yieldInfo(sub, db, set, st);
    if (!s || depth > 6 || !(y.value > 0)) return;
    const f = flag || y.source === 'estimate' || y.source === 'input', batches = qty / y.value;
    for (const [n, q, u, k] of s.lines) k === 'S' ? explode(dish, n, q * batches, depth + 1, f) : add(dish, n, q * batches, u, f);
  };
  for (const d of dishes) {
    for (const [n, k] of (db.lines[d.id] || [])) if (k === 'S') (usedIn[n] = usedIn[n] || new Set()).add(d.id);
    if (!(d.portions > 0)) continue;
    for (const [n, k, q, u] of (db.lines[d.id] || [])) k === 'S' ? explode(d.id, n, q * d.portions, 1, false) : add(d.id, n, q * d.portions, u, false);
  }
  const dishById = Object.fromEntries(dishes.map(d => [d.id, d]));
  const stockWeek = (st.stock || {})[week.key] || {};
  const rows = Object.keys(byDish).filter(k => !WATER.test(k)).map(key => {
    const pcs = key.endsWith(' (pcs)'), name = pcs ? key.slice(0, -6) : key;
    const custom = (set.units || {})[name];
    const allMl = Object.keys(units[key]).every(u => u === 'ml');
    const [unit, factor] = pcs ? ['pcs', 1] : custom ? custom : allMl ? ['L', 1000] : ['kg', 1000];
    const parts = Object.entries(byDish[key]).map(([id, q]) => ({ id, name: dishById[id].name, portions: dishById[id].portions, need: q / factor * (1 + buf) }))
      .sort((a, b) => b.need - a.need);
    const need = parts.reduce((a, p) => a + p.need, 0);
    const pack = pick((st.packs || {})[name], (set.packs || {})[name]);
    const stock = pick(stockWeek[name]);
    const toOrder = Math.max(0, need - stock);
    const mine = (st.suppliers || {})[name];
    const supplier = mine !== undefined && mine !== null ? mine : ((set.suppliers || {})[name] || '');
    return { key, name, unit, need, stock, toOrder, pack, packs: pack > 0 ? Math.ceil(toOrder / pack - 1e-9) : null,
      supplier: supplier || NO_SUPPLIER, dishes: parts, portions: parts.reduce((a, p) => a + p.portions, 0),
      group: (set.groups || {})[name] || ruleGroup((db.ingredients || {})[name]), estimate: !!est[key],
      note: (set.notes || {})[name] || '', packInfo: (set.packInfo || {})[name] || '' };
  });
  const subs = Object.keys(cooked).map(name => {
    const y = yieldInfo(name, db, set, st), s = db.subs[name] || {};
    return { name, cooked: cooked[name], yield: y.value, source: y.source, why: y.why, dbYield: s.dbYield, input: s.input,
      batches: y.value > 0 ? cooked[name] / y.value : 0, usedIn: [...(usedIn[name] || [])] };
  });
  return { menus: wm.menus, onDay: wm.onDay, dishes, rows, subs, buf, portionsSum: dishes.reduce((a, d) => a + d.portions, 0) };
}
/*CORE-END*/

const $ = s => document.querySelector(s);
window.addEventListener('error', e => { const el = $('#appError'); if (el) { el.hidden = false; el.textContent = `Something went wrong: ${e.message}. Reload the page with Ctrl+F5.`; } });
const KEY = 'nrw-stock-planner-v1';
const XLSX_URL = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
const TYPES = { LC: 'Lunch Classics', SB: 'Salads & Bowls', CI: 'Cucina Italiana', SW: 'Sandwiches & Wraps', HE: 'Heat to Eat', AD: 'Add-ons' };
let DB, SET, PLAN, WEEK, FIRST_WEEK, LIVE = false, SEARCH = '';
let ST = (() => { try { return JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch (e) { return {}; } })();
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(ST)); } catch (e) { /* ponytail: storage blocked -> edits last until reload */ } };

const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const nf = (v, d) => Number(v).toLocaleString('en-GB', { minimumFractionDigits: d, maximumFractionDigits: d });
const whole = unit => unit === 'eggs' || unit === 'pcs';
const qty = (v, unit) => whole(unit) ? nf(Math.ceil(v - 1e-9), 0) : nf(v, v < 10 ? 2 : 1);
const q2 = (v, unit) => whole(unit) ? Math.ceil(v - 1e-9) : Math.round(v * 100) / 100;
const at12 = d => { const x = new Date(d); x.setHours(12, 0, 0, 0); return x; };
const addDays = (d, n) => { const x = at12(d); x.setDate(x.getDate() + n); return x; };
const mondayOf = d => addDays(d, -((at12(d).getDay() + 6) % 7));
const iso = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const fromIso = s => at12(s + 'T12:00:00');
const day = d => d.toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' });
const dm = d => d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
const stamp = s => new Date(s).toLocaleString('en-GB', { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });
const weekNo = d => { const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate())); t.setUTCDate(t.getUTCDate() + 4 - (t.getUTCDay() || 7)); return Math.ceil(((t - Date.UTC(t.getUTCFullYear(), 0, 1)) / 864e5 + 1) / 7); };
const VIEWS = ['forecast', 'order', 'yields', 'checks'];
const view = () => VIEWS.includes(ST.view) ? ST.view : 'forecast';
const showDishes = () => ST.showDishes !== false;

function weekOf(mon) {
  const days = [0, 1, 2, 3, 4].map(i => iso(addDays(mon, i)));
  return { mon, key: days[0], days, no: weekNo(mon), label: `${dm(mon)} – ${dm(addDays(mon, 4))}` };
}

// Delivery 1 (Tue 29 Sep) is for the first week that has an NRW menu. After that: the Friday before each week.
function firstServiceWeek() {
  let mon = mondayOf(fromIso(SET.firstDelivery));
  for (let i = 0; i < 12; i++, mon = addDays(mon, 7)) if (weekMenu(DB, weekOf(mon).days).ids.length) return mon;
  return mondayOf(fromIso(SET.firstDelivery));
}
function deliveriesFor(mon) {
  const first = fromIso(SET.firstDelivery), fri = addDays(mon, -3), out = [];
  if (iso(mon) === iso(FIRST_WEEK)) out.push({ date: first, label: `Delivery 1: ${day(first)}` });
  if (fri >= first && iso(fri) !== iso(first)) out.push({ date: fri, label: day(fri) });
  return out;
}
function deliveryLabel(dl) {
  if (!dl.length) return 'Before the first delivery';
  if (dl.length === 2) return `${dl[0].label}, then ${dl[1].label}`;
  return dl[0].label.startsWith('Delivery 1') ? dl[0].label : `Delivery: ${dl[0].label}`;
}

function defaultWeek() { // the next week that has an NRW menu and a delivery still to come
  const asked = new URLSearchParams(location.search).get('week');
  if (/^\d{4}-\d{2}-\d{2}$/.test(asked || '')) return mondayOf(fromIso(asked));
  const today = at12(new Date());
  let mon = mondayOf(today);
  for (let i = 0; i < 12; i++, mon = addDays(mon, 7)) {
    const dl = deliveriesFor(mon);
    if (dl.length && dl[dl.length - 1].date >= today && weekMenu(DB, weekOf(mon).days).ids.length) return mon;
  }
  return mondayOf(today);
}

function tidyOldData() { // settings saved by older versions of this page
  for (const k of ['portions', 'off', 'delivery', 'days1', 'daysW', 'portionsPerDay']) delete ST[k];
  const flat = Object.entries(ST.stock || {}).filter(([, v]) => typeof v !== 'object');
  if (flat.length) {
    const wk = iso(WEEK);
    ST.stock[wk] = ST.stock[wk] || {};
    for (const [k, v] of flat) { if (!(k in ST.stock[wk])) ST.stock[wk][k] = v; delete ST.stock[k]; }
  }
  if (ST.view && !VIEWS.includes(ST.view)) ST.view = 'forecast';
  save();
}

function menuText(P) {
  if (!P.menus.length) return 'No NRW menu in the database for this week yet';
  return 'NRW menu: ' + P.menus.map(m => `${m.name} (${dm(fromIso(m.from))} – ${dm(fromIso(m.to))})`).join(', ');
}

function render() {
  const week = weekOf(WEEK);
  PLAN = computePlan(DB, SET, ST, week);
  PLAN.week = week;
  PLAN.delivery = deliveryLabel(deliveriesFor(WEEK));
  $('#kitchen').textContent = `${SET.kitchen}. NRW menus only, forecast typed by you.`;
  $('#freshness').textContent = `BB database data from ${stamp(DB.generated)}${LIVE ? '' : ' (built-in copy)'}`;
  renderWeek();
  const b = $('#sBuffer'); if (document.activeElement !== b) b.value = Math.round(PLAN.buf * 100);
  $('#showDishes').checked = showDishes();
  for (const t of document.querySelectorAll('[data-tab]')) t.setAttribute('aria-selected', String(t.dataset.tab === view()));
  for (const id of ['forecast', 'order', 'yields', 'checks']) $('#p-' + id).hidden = id !== view();
  ({ forecast: renderForecast, order: renderOrder, yields: renderYields, checks: renderChecks })[view()]();
}

function renderWeek() {
  const P = PLAN, w = P.week;
  $('#week').innerHTML = `<span class="kind">Week ${w.no}, ${w.mon.getFullYear()}</span><span class="date">${w.label}</span>
    <span class="cover">${esc(P.delivery)}. Forecast: ${nf(P.portionsSum, 0)} portions</span>
    <span class="menu${P.menus.length ? '' : ' warn'}">${esc(menuText(P))}</span>`;
  const chips = [];
  for (let i = -1; i < 7; i++) {
    const mon = addDays(WEEK, 7 * i), wk = weekOf(mon), wm = weekMenu(DB, wk.days);
    const portions = wk.days.reduce((a, d) => a + Object.values((ST.fc || {})[d] || {}).reduce((x, v) => x + pick(v), 0), 0);
    chips.push(`<button class="wk" data-goto="${wk.key}" aria-current="${i === 0}"><b>W${wk.no}</b>${dm(mon)}
      <span class="${wm.ids.length ? 'ok' : 'no'}">${wm.ids.length ? `Menu, ${wm.ids.length} dishes` : 'No menu yet'}</span>${portions ? `<span>${nf(portions, 0)} portions</span>` : ''}</button>`);
  }
  $('#weeks').innerHTML = chips.join('');
}

function renderForecast() {
  const P = PLAN, w = P.week;
  if (!P.dishes.length) {
    $('#p-forecast').innerHTML = `<p class="empty">No NRW menu in the database for ${w.label} yet. As soon as the menu team adds it (kitchen NRW, with this week's dates), the dishes show up here and you can type the forecast.</p>`;
    return;
  }
  const heads = w.days.map((d, i) => `<th class="day" scope="col">${day(fromIso(d))}${P.onDay[i].size ? '' : '<div class="note">No menu</div>'}</th>`).join('');
  let group = '';
  const rows = P.dishes.map(d => {
    const head = d.type !== group ? `<tr class="group"><td colspan="${w.days.length + 3}">${esc(TYPES[d.type] || d.type || 'Other')}</td></tr>` : '';
    group = d.type;
    const cells = d.perDay.map((v, i) => v === null ? '<td class="nomenu">–</td>'
      : `<td class="day"><input type="number" min="0" step="1" inputmode="numeric" data-fc="${w.days[i]}|${esc(d.id)}" data-fid="fc|${w.days[i]}|${esc(d.id)}" value="${v > 0 ? v : ''}" placeholder="0" aria-label="${esc(d.name)}, ${day(fromIso(w.days[i]))}"></td>`).join('');
    return `${head}<tr><td><div class="name">${esc(d.name)}</div>${d.noRecipe ? '<span class="tag est">No recipe in DB</span>' : ''}${d.incomplete ? `<span class="tag est">Recipe incomplete in DB: ${nf(d.lineG, 0)} of ${nf(d.portion, 0)} g</span>` : ''}</td>${cells}
      <td class="day"><input type="number" min="0" step="1" inputmode="numeric" data-fill="${esc(d.id)}" data-fid="fill|${esc(d.id)}" placeholder="all" aria-label="Same number every day, ${esc(d.name)}"></td>
      <td class="num qty">${nf(d.portions, 0)}</td></tr>`;
  }).join('');
  const dayTotals = w.days.map((_, i) => `<td class="num">${nf(P.dishes.reduce((a, d) => a + (d.perDay[i] || 0), 0), 0)}</td>`).join('');
  $('#p-forecast').innerHTML = `<p class="lead">${esc(menuText(P))}. Type how many portions of each dish you forecast per day. Use <em>All days</em> to put the same number on every day. The order list adds it all up.</p>
    <div class="tablewrap"><table class="plain fc">
      <thead><tr><th scope="col">Dish</th>${heads}<th class="day" scope="col">All days</th><th class="num" scope="col">Week</th></tr></thead>
      <tbody>${rows}</tbody>
      <tfoot><tr><td>Total</td>${dayTotals}<td></td><td class="num">${nf(P.portionsSum, 0)}</td></tr></tfoot>
    </table></div>
    <p><button class="btn" id="clearWeek">Clear this week's forecast</button></p>`;
}

function bySupplier(rows) {
  const groups = {};
  for (const r of rows) (groups[r.supplier] = groups[r.supplier] || []).push(r);
  const names = Object.keys(groups).sort((a, b) => (a === NO_SUPPLIER) - (b === NO_SUPPLIER) || a.localeCompare(b));
  return names.map(s => [s, groups[s].sort((a, b) => a.name.localeCompare(b.name))]);
}

function supplierOptions(r) {
  const offered = (SET.supplierOptions || {})[r.name] || [];
  const others = (SET.supplierList || []).filter(s => !offered.includes(s));
  const opt = s => `<option value="${esc(s)}"${s === r.supplier ? ' selected' : ''}>${esc(s)}</option>`;
  const custom = r.supplier !== NO_SUPPLIER && !offered.includes(r.supplier) && !others.includes(r.supplier) ? opt(r.supplier) : '';
  return `<option value=""${r.supplier === NO_SUPPLIER ? ' selected' : ''}>${NO_SUPPLIER}</option>${custom}`
    + (offered.length ? `<optgroup label="Sells this item (Apicbase)">${offered.map(opt).join('')}</optgroup>` : '')
    + (others.length ? `<optgroup label="Other suppliers">${others.map(opt).join('')}</optgroup>` : '');
}

function itemHtml(r) {
  const n = esc(r.name), u = `<small>${esc(r.unit)}</small>`, show = showDishes();
  const tags = [r.group === FRESH ? '<span class="tag fresh">Fresh</span>' : '', r.estimate ? '<span class="tag est">Yield estimate</span>' : ''].join('');
  const dishRows = show ? r.dishes.map(d => `<tr class="dish"><td>${esc(d.name)}</td><td class="num">${nf(d.portions, 0)}</td><td class="num">${qty(d.need, r.unit)}${u}</td><td></td><td></td><td></td><td></td></tr>`).join('') : '';
  return `<tbody class="item">
    <tr class="total">
      <th scope="rowgroup" rowspan="${1 + (show ? r.dishes.length : 0)}" class="item-cell">
        <div class="name">${n}</div>${tags ? `<div class="tags">${tags}</div>` : ''}
        ${r.packInfo ? `<div class="note">Apicbase pack: ${esc(r.packInfo)}</div>` : ''}${r.note ? `<div class="note">${esc(r.note)}</div>` : ''}
        <label class="suppick">Supplier <select data-sup="${n}" data-fid="sup|${n}">${supplierOptions(r)}</select></label>
      </th>
      <td>${r.dishes.length} ${r.dishes.length === 1 ? 'dish' : 'dishes'}</td>
      <td class="num">${nf(r.portions, 0)}</td>
      <td class="num qty">${qty(r.need, r.unit)}${u}</td>
      <td class="num"><input type="number" min="0" step="any" inputmode="decimal" data-stock="${n}" data-fid="stock|${n}" value="${r.stock > 0 ? r.stock : ''}" placeholder="0" aria-label="Stock on hand in ${esc(r.unit)}, ${n}"></td>
      <td class="num qty">${qty(r.toOrder, r.unit)}${u}</td>
      <td class="num"><input type="number" min="0" step="any" inputmode="decimal" data-pack="${n}" data-fid="pack|${n}" value="${r.pack > 0 ? r.pack : ''}" placeholder="–" aria-label="Pack size in ${esc(r.unit)}, ${n}"></td>
      <td class="num qty">${r.packs == null ? '–' : r.packs}</td>
    </tr>${dishRows}
  </tbody>`;
}

function renderOrder() {
  const P = PLAN, w = P.week, q = SEARCH.trim().toLowerCase();
  $('#printTitle').textContent = `NRW order, week ${w.no} (${w.label}). ${P.delivery}. ${nf(P.portionsSum, 0)} portions.`;
  const count = f => P.rows.filter(f).length;
  const sups = new Set(P.rows.map(r => r.supplier).filter(s => s !== NO_SUPPLIER)).size;
  const none = count(r => r.supplier === NO_SUPPLIER), est = count(r => r.estimate), noPack = count(r => !(r.pack > 0));
  $('#chips').innerHTML = [`${P.rows.length} items`, `${nf(P.portionsSum, 0)} portions`, `${sups} suppliers`, none ? `${none} without supplier` : '', est ? `${est} depend on a yield estimate` : '', noPack ? `${noPack} without pack size` : '']
    .filter(Boolean).map(x => `<span class="chip">${x}</span>`).join('');
  if (!P.dishes.length) { $('#orderList').innerHTML = `<p class="empty">No NRW menu in the database for ${w.label} yet.</p>`; return; }
  if (!P.rows.length) { $('#orderList').innerHTML = '<p class="empty">No forecast for this week yet. Type the portions in <em>Menu &amp; forecast</em> and the order list fills in.</p>'; return; }
  const rows = q ? P.rows.filter(r => r.name.toLowerCase().includes(q) || r.dishes.some(d => d.name.toLowerCase().includes(q))) : P.rows;

    <section class="sup${s === NO_SUPPLIER ? ' none' : ''}"><h2>${esc(s)} <span class="count">${items.length} ${items.length === 1 ? 'item' : 'items'}</span></h2>
      <div class="tablewrap"><table class="order">
        <thead><tr><th scope="col">Item</th><th scope="col">Dish</th><th class="num" scope="col">Portions</th><th class="num" scope="col">Need, incl. ${Math.round(P.buf * 100)}% buffer</th><th class="num" scope="col">Stock on hand</th><th class="num" scope="col">To order</th><th class="num" scope="col">Pack size</th><th class="num" scope="col">Packs</th></tr></thead>
        ${items.map(itemHtml).join('')}
      </table></div>
    </section>`).join('');
}

const SRC = { estimate: ['est', 'Estimate, please confirm'], input: ['est', 'No yield in DB, using input weight'], confirmed: ['ok', 'Confirmed'], db: ['db', 'From DB'] };
function renderYields() {
  const rank = { estimate: 0, input: 1, db: 2, confirmed: 3 };
  const subs = [...PLAN.subs].sort((a, b) => rank[a.source] - rank[b.source] || b.cooked - a.cooked);
  if (!subs.length) { $('#p-yields').innerHTML = '<p class="empty">No sub-recipes this week yet. They show up once the week has a menu and a forecast.</p>'; return; }
  const open = subs.filter(s => rank[s.source] < 2).length;
  const rows = subs.map(s => {
    const [cls, label] = SRC[s.source], n = esc(s.name);
    return `<tr>
      <td><div class="name">${n}</div><div class="note">${s.usedIn.length ? `In ${s.usedIn.length} ${s.usedIn.length === 1 ? 'dish' : 'dishes'}` : 'Inside another sub-recipe'}</div></td>
      <td class="num">${nf(s.cooked / 1000, 1)} kg</td>
      <td class="num">${s.dbYield > 0 ? nf(s.dbYield, 0) : 'missing'}</td>
      <td class="num">${s.input > 0 ? nf(s.input, 0) : '–'}</td>
      <td class="num"><input type="number" min="1" step="any" inputmode="decimal" data-yield="${n}" data-fid="yield|${n}" value="${Math.round(s.yield * 10) / 10}" aria-label="Yield in grams, ${n}"></td>
      <td class="num">${nf(s.batches, 2)}</td>
      <td><span class="tag ${cls}">${label}</span>${s.why ? `<div class="note">${esc(s.why)}</div>` : ''}${rank[s.source] < 2 ? `<button class="btn tiny" data-confirm="${n}">Confirm ${nf(s.yield, 0)} g</button>` : ''}</td>
    </tr>`;
  }).join('');
  $('#p-yields').innerHTML = `<p class="lead">${open ? `${open} of ${subs.length} yields need the kitchen lead's check.` : 'All yields are confirmed or come from the DB.'} Yield is the cooked weight one batch gives. Changing a value marks it confirmed and updates the order list.</p>
    <div class="tablewrap"><table class="plain">
      <thead><tr><th scope="col">Sub-recipe</th><th class="num" scope="col">Cooked this week</th><th class="num" scope="col">DB yield (g)</th><th class="num" scope="col">Batch input (g)</th><th class="num" scope="col">Yield used (g)</th><th class="num" scope="col">Batches this week</th><th scope="col">Status</th></tr></thead>
      <tbody>${rows}</tbody>
    </table></div>
    <p class="small muted">To share suppliers, pack sizes, yields and forecasts with everyone, download the settings file and replace <code>data/kitchen-settings.json</code> in the GitHub repo.</p>
    <p><button class="btn primary" id="settingsBtn">Download settings file</button></p>`;
}

function renderChecks() {
  const warn = DB.warnings || [];
  $('#p-checks').innerHTML = `<h2 class="h2">Before you order</h2><ul class="checks">${(SET.checks || []).map(x => `<li>${esc(x)}</li>`).join('')}</ul>
    ${PLAN.dishes.some(d => d.incomplete) ? `<h2 class="h2">Recipes that look incomplete in the DB (this week)</h2><ul class="checks">${PLAN.dishes.filter(d => d.incomplete).map(d => `<li>${esc(d.name)}: recipe lines add up to ${nf(d.lineG, 0)} g of a ${nf(d.portion, 0)} g dish. The order list only has those lines.</li>`).join('')}</ul>` : ''}
    ${warn.length ? `<h2 class="h2">Recipe lines skipped</h2><ul class="checks">${warn.map(w => `<li>${esc(w)}</li>`).join('')}</ul>` : ''}
    <h2 class="h2">Where the numbers come from</h2>
    <p class="lead">NRW menus and recipes come from the BB database (${esc(stamp(DB.generated))}). ${LIVE ? 'GitHub refreshes data/db-snapshot.json every hour.' : 'This is the copy built into the page. On GitHub the page loads the hourly refresh.'} Portions are only what you type in the forecast. Stock counts, forecasts, suppliers, pack sizes and yields you type are saved in this browser.</p>
    <p><button class="btn" id="clearAll">Clear my changes</button></p>`;
}

function download(name, text, type) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], { type }));
  a.download = name;
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 0);
}

function loadXLSX() { // ponytail: Excel library loads only when someone downloads
  if (window.XLSX) return Promise.resolve(window.XLSX);
  return new Promise((ok, fail) => {
    const s = document.createElement('script');
    s.src = XLSX_URL; s.onload = () => ok(window.XLSX); s.onerror = () => fail(new Error('Excel library did not load'));
    document.head.appendChild(s);
  });
}

async function exportExcel() {
  let X;
  try { X = await loadXLSX(); } catch (e) { alert('The Excel tool could not load. Check the internet connection and try again.'); return; }
  const P = PLAN, order = [['Name', 'Qty', 'Unit']];
  const detail = [['Supplier', 'Item', 'Dish', 'Portions', 'Need', 'Unit', 'Stock on hand', 'To order', 'Pack size', 'Packs']];
  for (const [s, items] of bySupplier(P.rows)) for (const r of items) {
    order.push([r.name, q2(r.toOrder, r.unit), r.unit]);
    detail.push([s, r.name, 'All dishes', Math.round(r.portions), q2(r.need, r.unit), r.unit, r.stock, q2(r.toOrder, r.unit), r.pack > 0 ? r.pack : '', r.packs == null ? '' : r.packs]);
    for (const d of r.dishes) detail.push([s, r.name, d.name, Math.round(d.portions), q2(d.need, r.unit), r.unit]);
  }
  const wb = X.utils.book_new(), a = X.utils.aoa_to_sheet(order), b = X.utils.aoa_to_sheet(detail);
  a['!cols'] = [{ wch: 46 }, { wch: 10 }, { wch: 6 }];
  b['!cols'] = [{ wch: 22 }, { wch: 40 }, { wch: 48 }, { wch: 9 }, { wch: 9 }, { wch: 6 }, { wch: 13 }, { wch: 9 }, { wch: 9 }, { wch: 7 }];
  X.utils.book_append_sheet(wb, a, 'Order');
  X.utils.book_append_sheet(wb, b, 'By supplier and dish');
  X.writeFile(wb, `nrw-order-week${P.week.no}-${P.week.key}.xlsx`);
}

function exportSettings() {
  const out = JSON.parse(JSON.stringify(SET));
  out.yields = out.yields || {}; out.packs = out.packs || {}; out.suppliers = out.suppliers || {};
  for (const [name, v] of Object.entries(ST.yields || {})) out.yields[name] = Object.assign({}, out.yields[name], { yield: +v, confirmed: true });
  for (const [name, v] of Object.entries(ST.packs || {})) { if (+v > 0) out.packs[name] = +v; else delete out.packs[name]; }
  for (const [name, v] of Object.entries(ST.suppliers || {})) { if (v) out.suppliers[name] = v; else delete out.suppliers[name]; }
  if (ST.fc) out.forecast = Object.assign({}, out.forecast, ST.fc);
  if (ST.buffer != null) out.buffer = ST.buffer;
  download('kitchen-settings.json', JSON.stringify(out, null, 2) + '\n', 'application/json');
}

function setMap(k, key, v) {
  ST[k] = ST[k] || {};
  if (v === null || v === undefined) delete ST[k][key]; else ST[k][key] = v;
}
function setFc(dayIso, id, v) {
  ST.fc = ST.fc || {};
  const m = ST.fc[dayIso] = ST.fc[dayIso] || {};
  if (v === null) delete m[id]; else m[id] = v;
  if (!Object.keys(m).length) delete ST.fc[dayIso];
}

let pending = false;
function rerenderSoon() { // wait for focus to move, then re-render and put the cursor back
  if (pending) return;
  pending = true;
  setTimeout(() => {
    pending = false;
    const fid = document.activeElement && document.activeElement.dataset ? document.activeElement.dataset.fid : null;
    render();
    const el = fid && document.querySelector(`[data-fid="${CSS.escape(fid)}"]`);
    if (el) el.focus();
  }, 0);
}

document.addEventListener('change', e => {
  const el = e.target, d = el.dataset;
  const val = el.value === '' || !Number.isFinite(+el.value) || +el.value < 0 ? null : +el.value;
  if ('fc' in d) { const [dayIso, id] = d.fc.split('|'); setFc(dayIso, id, val); }
  else if ('fill' in d) { const i = PLAN.dishes.findIndex(x => x.id === d.fill); if (i >= 0) PLAN.dishes[i].perDay.forEach((v, j) => { if (v !== null) setFc(PLAN.week.days[j], d.fill, val); }); }
  else if ('stock' in d) { ST.stock = ST.stock || {}; ST.stock[PLAN.week.key] = ST.stock[PLAN.week.key] || {}; if (val === null) delete ST.stock[PLAN.week.key][d.stock]; else ST.stock[PLAN.week.key][d.stock] = val; }
  else if ('pack' in d) setMap('packs', d.pack, val === null ? 0 : val);
  else if ('sup' in d) setMap('suppliers', d.sup, el.value);
  else if ('yield' in d) setMap('yields', d.yield, val > 0 ? val : null);
  else if (el.id === 'showDishes') ST.showDishes = el.checked;
  else if (el.id === 'sBuffer') ST.buffer = val === null ? null : val / 100;
  else return;
  save();
  rerenderSoon();
});

document.addEventListener('click', e => {
  const b = e.target.closest('button');
  if (!b) return;
  if (b.dataset.tab) { ST.view = b.dataset.tab; save(); render(); }
  else if (b.dataset.step) { WEEK = addDays(WEEK, +b.dataset.step); render(); }
  else if (b.dataset.goto) { WEEK = mondayOf(fromIso(b.dataset.goto)); render(); }
  else if (b.dataset.confirm) { const s = PLAN.subs.find(x => x.name === b.dataset.confirm); if (s) { setMap('yields', s.name, s.yield); save(); render(); } }
  else if (b.id === 'xlsxBtn') exportExcel();
  else if (b.id === 'printBtn') { ST.view = 'order'; render(); window.print(); }
  else if (b.id === 'settingsBtn') exportSettings();
  else if (b.id === 'clearWeek' && confirm(`Clear the forecast for ${PLAN.week.label}?`)) { for (const d of PLAN.week.days) if (ST.fc) delete ST.fc[d]; save(); render(); }
  else if (b.id === 'clearAll' && confirm('Clear everything you typed in this browser: forecasts, stock counts, suppliers, pack sizes, yields and the buffer?')) { ST = { view: 'checks' }; save(); render(); }
});

$('#search').addEventListener('input', e => { SEARCH = e.target.value; renderOrder(); });

async function loadJSON(path, seedId) {
  try {
    const r = await fetch(path, { cache: 'no-store' });
    if (r.ok) return { data: await r.json(), live: true };
  } catch (e) { /* opened as a file or offline: use the built-in copy */ }
  return { data: JSON.parse(document.getElementById(seedId).textContent), live: false };
}

(async () => {
  try {
    const [a, b] = await Promise.all([loadJSON('data/db-snapshot.json', 'seedDb'), loadJSON('data/kitchen-settings.json', 'seedSettings')]);
    DB = a.data; SET = b.data; LIVE = a.live;
    if (SET.forecast) { // shared forecast from the settings file fills days you have not typed yourself
      ST.fc = ST.fc || {};
      for (const [d, m] of Object.entries(SET.forecast)) ST.fc[d] = Object.assign({}, m, ST.fc[d]);
    }
    FIRST_WEEK = firstServiceWeek();
    WEEK = defaultWeek();
    tidyOldData();
    render();
  } catch (e) {
    const el = $('#appError');
    el.hidden = false;
    el.textContent = `The planner could not load its data (${e.message}). Check that data/db-snapshot.json and data/kitchen-settings.json are valid JSON.`;
  }
})();
</script>
</body>
