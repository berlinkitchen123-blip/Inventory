<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NRW Stock Planner</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%93%A6%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#121a17;--panel:#18231f;--panel-2:#1f2e28;--line:#2c3c36;--ink:#eef2ec;--ink-2:#aab9b1;--ink-3:#84958c;--saffron:#f0b541;--paprika:#ec8f74;--herb:#8fc9a3;color-scheme:dark;font-family:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-size:15px;line-height:1.45}
.wrap{max-width:1180px;margin:0 auto;padding:22px 16px 72px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--saffron);outline-offset:2px}
.top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:4px 24px;margin-bottom:18px}
.top p{margin:2px 0 0}
h1{margin:0;font-size:26px;font-weight:800;letter-spacing:-.02em}
.muted{color:var(--ink-2)}.small{font-size:13px}
.error{background:#3a1f19;border:1px solid var(--paprika);padding:10px 12px;border-radius:8px}
.weekbar{display:grid;grid-template-columns:auto 1fr auto;align-items:stretch;gap:10px}
.nav{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:0 16px;font-size:22px;font-weight:800;color:var(--ink-2)}
.nav:hover{border-color:var(--saffron);color:var(--ink)}
.ticket{position:relative;display:flex;flex-direction:column;background:var(--panel-2);border:1px solid var(--saffron);border-radius:14px;padding:16px 28px 16px 22px;overflow:hidden}
.ticket::before{content:"";position:absolute;top:0;bottom:0;left:0;width:6px;background:var(--saffron)}
.ticket::after{content:"";position:absolute;top:0;right:0;bottom:0;width:10px;background:radial-gradient(circle at 10px 9px,var(--bg) 4px,transparent 4.5px) 0 0/10px 18px repeat-y}
.ticket .kind{font-size:13px;font-weight:600;color:var(--ink-2)}
.ticket .date{font-size:clamp(28px,5.5vw,44px);font-weight:800;letter-spacing:-.035em;line-height:1.05;margin:4px 0 6px}
.ticket .cover{font-size:14px;color:var(--ink-2)}
.ticket .menu{font-size:13px;color:var(--herb);margin-top:4px}
.ticket .menu.warn{color:var(--paprika)}
.weeks{display:flex;gap:6px;margin-top:10px;overflow-x:auto;padding-bottom:2px}
.wk{flex:0 0 auto;display:flex;flex-direction:column;align-items:flex-start;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-size:12.5px;color:var(--ink-2);text-align:left}
.wk b{font-size:14px;color:var(--ink)}
.wk[aria-current="true"]{border-color:var(--saffron);background:var(--panel-2)}
.wk .ok{color:var(--herb)}.wk .no{color:var(--ink-3)}
details.settings{margin-top:14px;border:1px solid var(--line);border-radius:10px;padding:10px 14px;background:var(--panel)}
details.settings summary{cursor:pointer;font-weight:600}
.settings-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-top:12px}
.settings-grid label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--ink-2)}
.settings-grid input{width:120px}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:18px 0 14px;overflow-x:auto}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;margin-bottom:-1px;padding:10px 14px;font-weight:600;color:var(--ink-2);white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--saffron)}
.toolbar{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px 16px;margin-bottom:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:13px;color:var(--ink-2);background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:3px 10px}
.actions{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.toggle{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--ink-2)}
.btn{background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:8px 13px;font-weight:600}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--saffron);border-color:var(--saffron);color:#1c1504}
.btn.tiny{padding:3px 9px;font-size:12.5px;margin-top:6px}
input[type=search],input[type=number],select{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 9px}
input[type=search]{min-width:220px}
input[type=number]{width:84px;text-align:right;font-variant-numeric:tabular-nums}
input[type=number]:disabled{opacity:.4}
input[type=checkbox]{width:18px;height:18px;accent-color:var(--saffron)}
.fc input[type=number]{width:66px;padding:6px 7px}
.fc td.day,.fc th.day{text-align:center}
.fc td.nomenu{color:var(--ink-3);text-align:center}
.fc tr.group td{background:var(--panel);font-size:12px;font-weight:700;color:var(--ink-3);text-transform:uppercase;letter-spacing:.04em}
.sup{margin-top:24px}
.sup h2{margin:0 0 8px;font-size:19px;font-weight:800;display:flex;align-items:baseline;gap:10px}
.sup h2 .count{font-size:13px;font-weight:600;color:var(--ink-3)}
.sup.none h2{color:var(--paprika)}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:8px 10px;text-align:left;vertical-align:top}
thead th{background:var(--panel);font-size:12px;font-weight:600;color:var(--ink-3);white-space:nowrap}
td.num,th.num{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
table.order{min-width:900px}
table.order tbody.item{border-top:1px solid var(--line)}
table.order .item-cell{width:30%;font-weight:400}
table.order tr.total td{font-weight:600}
table.order tr.dish td{padding-top:3px;padding-bottom:3px;font-size:13px;color:var(--ink-2)}
table.order tr.dish:last-child td{padding-bottom:10px}
.name{font-weight:700}
.note{font-size:12.5px;color:var(--ink-2);margin-top:2px}
.tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.tag{display:inline-block;font-size:11.5px;font-weight:600;padding:1px 7px;border-radius:5px;border:1px solid currentColor}
.tag.est{color:var(--paprika)}.tag.ok{color:var(--herb)}.tag.db{color:var(--ink-3)}.tag.fresh{color:var(--herb)}
.suppick{display:flex;align-items:center;gap:6px;margin-top:6px;font-size:12.5px;color:var(--ink-3)}
.suppick select{padding:4px 6px;font-size:13px;max-width:200px}
.qty{font-size:16px;font-weight:800}
.locked{font-variant-numeric:tabular-nums;color:var(--ink)}
#stockEditBtn[aria-pressed="true"]{background:var(--saffron);border-color:var(--saffron);color:#1c1504}
.editing input[data-stock]{border-color:var(--saffron)}
.num small{font-size:12px;font-weight:600;color:var(--ink-2);margin-left:3px}
.empty{color:var(--ink-2);padding:24px 0;max-width:70ch}
.lead{color:var(--ink-2);max-width:80ch}
table.plain th,table.plain td{border-top:1px solid var(--line)}
table.plain thead th{border-top:0}
tfoot td{font-weight:800}
.warn{color:var(--paprika)}
.h2{font-size:17px;font-weight:800;margin:22px 0 6px}
.checks{margin:0;padding-left:20px;max-width:80ch}
.checks li{margin:6px 0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
code{background:var(--panel-2);padding:1px 5px;border-radius:4px}
.print-title{display:none}
.uid-tag{display:inline-block;font-size:10px;font-family:monospace;color:var(--ink-3);background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:1px 5px;margin-top:2px;letter-spacing:.02em}
.uid-tag.missing{color:var(--paprika);border-color:var(--paprika);opacity:.7}
.btn.refresh{background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:3px 10px;font-size:12px;font-weight:600;color:var(--ink-2);display:inline-flex;align-items:center;gap:5px}
.btn.refresh:hover{border-color:var(--herb);color:var(--herb)}
.btn.refresh[aria-busy=true]{opacity:.6;pointer-events:none}
@keyframes spin{to{transform:rotate(360deg)}}
.spin{display:inline-block;animation:spin .7s linear infinite}
.who{text-align:right}.who p{margin:2px 0}
.authcard{max-width:520px;margin:24px auto;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px 20px}
.authcard .h2{margin-top:0}
.authcard label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--ink-2);margin:10px 0}
.authcard input{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 10px}
.authcard .actions{margin-top:12px}
@media (max-width:720px){
  .weekbar{grid-template-columns:44px 1fr 44px}
  .nav{padding:0}
  input[type=search]{min-width:0;flex:1}
  .actions{width:100%}
}
@media print{
  :root{color-scheme:light}
  html,body{background:#fff;color:#000}
  .weekbar,.weeks,.tabs,.settings,.actions,.who,#auth,#p-forecast,#p-yields,#p-checks{display:none!important}
  .print-title{display:block;font-size:18px;margin:0 0 8px}
  .tablewrap{overflow:visible;border-color:#bbb}
  table.order{min-width:0}
  tbody.item{break-inside:avoid;border-color:#bbb!important}
  thead th{background:none}
  .muted,.note,.num small,.count,.chip,.tag,thead th,table.order tr.dish td,.suppick{color:#333!important}
  .chip{border-color:#bbb;background:none}
  input,select{border:0!important;background:none!important;color:#000!important;padding:0;appearance:none}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1>NRW Stock Planner</h1>
      <p class="muted small" id="kitchen"></p>
    </div>
    <div class="who">
      <p class="muted small" id="freshness" style="display:flex;align-items:center;gap:8px;justify-content:flex-end;flex-wrap:wrap;"></p>
      <p class="muted small"><span id="status"></span> <span id="userEmail"></span> <button class="btn tiny" id="signOut" hidden>Sign out</button></p>
    </div>
  </header>
  <p class="error" id="appError" role="alert" hidden></p>
  <section class="authcard" id="auth" hidden>
    <h2 class="h2">Sign in</h2>
    <p class="lead">Forecasts, stock counts, suppliers, pack sizes and yields are saved online for the whole NRW team. Use your <span class="domain">@bellabona.com</span> email.</p>
    <form id="authForm">
      <label>Email<input type="email" id="aEmail" autocomplete="username" required></label>
      <label>Password<input type="password" id="aPass" autocomplete="current-password" required></label>
      <div class="actions"><button class="btn primary" type="submit">Sign in</button><button class="btn" type="button" id="aSignup">Create account</button><button class="btn" type="button" id="aReset">Forgot password</button></div>
    </form>
    <div id="verifyBox" hidden>
      <p>We sent a link to <strong id="verifyEmail"></strong>. Click it (check the spam folder too), then press Continue.</p>
      <div class="actions"><button class="btn primary" type="button" id="vContinue">Continue</button><button class="btn" type="button" id="vResend">Send the link again</button></div>
    </div>
    <p class="small" id="authMsg" role="status"></p>
  </section>
  <div id="app" hidden>
  <section class="weekbar" aria-label="Choose a week">
    <button class="nav" data-step="-7" aria-label="Previous week">‹</button>
    <div class="ticket" id="week"></div>
    <button class="nav" data-step="7" aria-label="Next week">›</button>
  </section>
  <nav class="weeks" id="weeks" aria-label="Weeks"></nav>
  <details class="settings">
    <summary>Plan settings</summary>
    <div class="settings-grid">
      <label>Waste and safety buffer (%)<input type="number" id="sBuffer" data-fid="sBuffer" min="0" max="100" step="1" inputmode="numeric"></label>
    </div>
  </details>
  <nav class="tabs" role="tablist" aria-label="Sections">
    <button role="tab" id="t-forecast" data-tab="forecast" aria-controls="p-forecast">Menu &amp; forecast</button>
    <button role="tab" id="t-order" data-tab="order" aria-controls="p-order">Order list</button>
    <button role="tab" id="t-yields" data-tab="yields" aria-controls="p-yields">Yields</button>
    <button role="tab" id="t-checks" data-tab="checks" aria-controls="p-checks">Checks</button>
  </nav>
  <main>
    <section id="p-forecast" role="tabpanel" aria-labelledby="t-forecast"></section>
    <section id="p-order" role="tabpanel" aria-labelledby="t-order" hidden>
      <h2 class="print-title" id="printTitle"></h2>
      <div class="toolbar">
        <div class="chips" id="chips"></div>
        <div class="actions">
          <input type="search" id="search" placeholder="Find item or dish" aria-label="Find item or dish">
          <label class="toggle"><input type="checkbox" id="showDishes" data-fid="showDishes"> Show dishes</label>
          <button class="btn" id="stockEditBtn" aria-pressed="false">Edit stock</button>
          <button class="btn" id="xlsxBtn">Download Excel</button>
          <button class="btn primary" id="printBtn">Print order</button>
        </div>
      </div>
      <div id="orderList"></div>
    </section>
    <section id="p-yields" role="tabpanel" aria-labelledby="t-yields" hidden></section>
    <section id="p-checks" role="tabpanel" aria-labelledby="t-checks" hidden></section>
  </main>
  </div>
</div>
<script type="application/json" id="seedDb">null</script>
<script type="application/json" id="seedSettings">null</script>
<script>
/*CORE-START*/
const WATER = /^(\[i\]\s*)?water$/i;
const FRESH = 'Fresh veg, fruit & herbs';
const NRW_UIDS = {"Ananas":"BB000008","Apple":"BB000009","Arugula":"BB000020","Baby Spinach":"BB000031","Bacon raw":"BB000034","Balsamic Dressing":"BB000040","Bandnudeln":"BB000044","Basil":"BB000045","Beef Goulash":"BB000051","Black Pepper":"BB000064","Broccoli":"BB000081","Brown Sugar":"BB000085","Bulgur":"BB000088","Burger Bun":"BB000089","Burger Meat":"BB000090","Butter":"BB000092","Butter Chicken":"BB000094","Caesar Dressing":"BB000104","Canola Oil (rapsöl)":"BB000107","Carrots":"BB000114","Cashew":"BB000117","Champignons":"BB000123","Cheddar Cheese":"BB000125","Cherry Tomatoes":"BB000129","Chicken Breast":"BB000132","Chicken Kebab":"BB000138","Chickpeas":"BB000151","Cooking Cream":"BB000180","Couscous Dry":"BB000186","Cream Cheese":"BB000189","Cucumber":"BB000196","Cucumber Pickled":"BB000197","Edamame":"BB000217","Eggs Large":"BB000221","Erbs Croutons":"BB000223","Feta Cheese":"BB000231","Fresh Mint":"BB000240","Fried Onions":"BB000242","Fusilli":"BB000243","Glass Noodles":"BB000255","Goat Cheese":"BB000257","Grapes - Red Seedless":"BB000269","Green Asparagus":"BB000271","Green Beans":"BB000272","Green Peas":"BB000276","Guacamole":"BB000279","Hard cheese - regular (instead of emmental, parmesan, grana padano)":"BB000286","Honey-Mustard dressing":"BB000294","Honeydew Melon":"BB000293","Iceberg Lettuce":"BB000296","Jalapeños":"BB000299","Kale":"BB000304","Lemon Dressing":"BB000325","Lentils - Green":"BB000328","Lime Juice":"BB000335","Mango - always frozen":"BB000341","Meatballs":"BB000348","Milk":"BB000355","Mint - fresh":"BB000359","Mozzarella Solid":"BB000368","Olive Oil":"BB000385","Olives Black":"BB000386","Orange vinegrette":"BB000396","Paprika powder":"BB000411","Parsley":"BB000420","Peanut dressing":"BB000428","Pesto Sauce":"BB000440","Pita Bread":"BB000446","Pomegranite Seeds":"BB000455","Potatoes Puree":"BB000466","Quick Cooking Noodles":"BB000220","Quinoa":"BB000483","Radicchio":"BB000484","Radish":"BB000486","Red Bell Pepper":"BB000496","Red cabbage":"BB000498","Red onion":"BB000506","Red pesto":"BB000508","Regular tomatoes":"BB000510","Rice - White Basmati":"BB000516","Salt":"BB000539","Sandwich Whole grain bread":"BB000541","Sesame Seeds":"BB000551","Small Potatoes":"BB000560","Smoked Salmon":"BB000561","Soy Sauce":"BB000573","Soy sprouts":"BB000574","Spatzle":"BB000576","Spinach leaves":"BB000582","Strawberry Jam":"BB000594","Sunflower Oil":"BB000597","Tofu Firm":"BB000618","Tomato - Sun Dried":"BB000626","Tomato Sauce":"BB000625","Tortellini Ham":"BB000629","Vegan Gyros":"BB000656","Vegan Mayo":"BB000658","Vegetable gyoza":"BB000667","Vinegar":"BB000675","WallNuts":"BB000678","Water":"BB000679","White Balsamic":"BB000683","Wraps 30\"":"BB000692","Yogurt Dressing":"BB000697","Zucchini":"BB000698","Avocado Frozen":"BB000025","Avocado fresh":"BB000026","Celeriac":"BB000119","Cheddar Grated":"BB000126","Chili Con Carne":"BB000155","Chilli Flakes":"BB000156","Corn":"BB000183","Corn Cream Soup":"BB000184","Cubed Pumpkin":"BB000195","Gelatin":"BB000250","Grapes - Green Seedless":"BB000270","Hummus":"BB000295","Lasagne alla Bolognese":"BB000323","Makhani Sauce":"BB000340","Mozzarella Mini":"BB000370","Peanuts":"BB000430","Pearled Barley":"BB000431","Penne Whole Wheat":"BB000432","Pumpkin Seeds":"BB000480","Red Kidney Beans":"BB000502","Schupznudeln":"BB000548","Semmelknödel":"BB000549","Smoked Tofu Firm":"BB000562","Sour Cream":"BB000570","Sriracha Mayonese":"BB000575","Sweet Potato":"BB000617","Sweet mash potatoe":"BB000619","Tandoori Naan":"BB000633","Tortellini Spinach":"BB000648","Tuna":"BB000651","Tzatziki":"BB000652","White Beans":"BB000682","Wild Rice":"BB000690","Yellow Thai Curry":"BB000696"};
const NO_SUPPLIER = 'No supplier yet';
const TYPE_ORDER = ['LC', 'SB', 'CI', 'SW', 'HE', 'AD'];

function pick(...vals) {
  for (const v of vals) if (v !== undefined && v !== null && v !== '' && Number.isFinite(+v)) return +v;
  return 0;
}

function ruleGroup(info) {
  const c = String((info && info.cat) || '').toLowerCase(), t = String((info && info.type) || '').toLowerCase();
  if (/meat|fish/.test(c)) return 'Meat & fish';
  if (c.includes('vegan protein')) return 'Vegan protein';
  if (c.includes('dairy')) return 'Dairy & eggs';
  if (c.includes('dressing')) return 'Sauces & dressings';
  if (c.includes('ready made') || t.includes('ready made')) return 'Ready-made components';
  if (c.includes('bread')) return 'Bread';
  if (t.includes('frozen')) return 'Frozen veg';
  if (c.includes('canned')) return 'Dry & canned';
  if (/vegetable|fruit/.test(c) || t.includes('produce')) return FRESH;
  if (/dry|grain|pasta/.test(c) || t === 'dry') return 'Dry goods';
  if (c.includes('spice')) return 'Oils, spices & condiments';
  return 'Other';
}

// Yield = cooked grams one batch gives. Order: your edit > settings file > DB > batch input weight.
function yieldInfo(name, db, set, st) {
  const s = db.subs[name] || {}, y = (set.yields || {})[name], why = (y && y.why) || '';
  const local = (st.yields || {})[name];
  if (pick(local) > 0) return { value: pick(local), source: 'confirmed', why };
  if (y && pick(y.yield) > 0) return { value: pick(y.yield), source: y.confirmed ? 'confirmed' : 'estimate', why };
  if (pick(s.dbYield) > 0) return { value: pick(s.dbYield), source: 'db', why };
  return { value: pick(s.input), source: 'input', why };
}

// NRW menus of one week, day by day (days = 'YYYY-MM-DD', Mon..Fri). A dish can be on some days only.
function weekMenu(db, days) {
  const first = days[0], last = days[days.length - 1];
  const menus = (db.menus || []).filter(m => m.from <= last && m.to >= first);
  const onDay = days.map(d => new Set(menus.filter(m => m.from <= d && d <= m.to).flatMap(m => m.dishes).filter(id => db.dishes[id])));
  const rank = t => { const i = TYPE_ORDER.indexOf(t); return i < 0 ? TYPE_ORDER.length : i; };
  const ids = [...new Set(onDay.flatMap(s => [...s]))]
    .sort((a, b) => rank(db.dishes[a].type) - rank(db.dishes[b].type) || db.dishes[a].name.localeCompare(db.dishes[b].name));
  return { menus, onDay, ids };
}

// Order need for one week = forecast portions x recipe, plus buffer, minus stock counted for that week.
function computePlan(db, set, st, week) {
  const wm = weekMenu(db, week.days), fc = st.fc || {};
  const dishes = wm.ids.map(id => {
    const d = db.dishes[id];
    const perDay = week.days.map((day, i) => wm.onDay[i].has(id) ? pick((fc[day] || {})[id]) : null); // null = not on that day's menu
    const lineG = (db.lines[id] || []).reduce((a, l) => a + (l[3] === 'g' || l[3] === 'ml' ? pick(l[2]) : 0), 0);
    return { id, name: d.name, type: d.type, perDay, portions: perDay.reduce((a, v) => a + (v || 0), 0), noRecipe: !(db.lines[id] || []).length,
      incomplete: pick(d.portion) > 0 && lineG > 0 && lineG < 0.5 * pick(d.portion), lineG, portion: pick(d.portion) }; // recipe lines < half the dish weight
  });
  const buf = pick(st.buffer, set.buffer);
  const byDish = {}, units = {}, cooked = {}, est = {}, usedIn = {};
  const add = (dish, name, qty, unit, flag) => {
    const key = unit === 'pcs' ? name + ' (pcs)' : name;
    const m = byDish[key] = byDish[key] || {};
    m[dish] = (m[dish] || 0) + qty;
    (units[key] = units[key] || {})[unit] = true;
    if (flag) est[key] = true;
  };
  const explode = (dish, sub, qty, depth, flag) => {
    cooked[sub] = (cooked[sub] || 0) + qty;
    const s = db.subs[sub], y = yieldInfo(sub, db, set, st);
    if (!s || depth > 6 || !(y.value > 0)) return;
    const f = flag || y.source === 'estimate' || y.source === 'input', batches = qty / y.value;
    for (const [n, q, u, k] of s.lines) k === 'S' ? explode(dish, n, q * batches, depth + 1, f) : add(dish, n, q * batches, u, f);
  };
  for (const d of dishes) {
    for (const [n, k] of (db.lines[d.id] || [])) if (k === 'S') (usedIn[n] = usedIn[n] || new Set()).add(d.id);
    if (!(d.portions > 0)) continue;
    for (const [n, k, q, u] of (db.lines[d.id] || [])) k === 'S' ? explode(d.id, n, q * d.portions, 1, false) : add(d.id, n, q * d.portions, u, false);
  }
  const dishById = Object.fromEntries(dishes.map(d => [d.id, d]));
  const stockWeek = (st.stock || {})[week.key] || {};
  const rows = Object.keys(byDish).filter(k => !WATER.test(k)).map(key => {
    const pcs = key.endsWith(' (pcs)'), name = pcs ? key.slice(0, -6) : key;
    const custom = (set.units || {})[name];
    const allMl = Object.keys(units[key]).every(u => u === 'ml');
    const [unit, factor] = pcs ? ['pcs', 1] : custom ? custom : allMl ? ['L', 1000] : ['kg', 1000];
    const parts = Object.entries(byDish[key]).map(([id, q]) => ({ id, name: dishById[id].name, portions: dishById[id].portions, need: q / factor * (1 + buf) }))
      .sort((a, b) => b.need - a.need);
    const need = parts.reduce((a, p) => a + p.need, 0);
    const pack = pick((st.packs || {})[name], (set.packs || {})[name]);
    const stock = pick(stockWeek[name]);
    const toOrder = Math.max(0, need - stock);
    const mine = (st.suppliers || {})[name];
    const supplier = mine !== undefined && mine !== null ? mine : ((set.suppliers || {})[name] || '');
    return { key, name, unit, need, stock, toOrder, pack, packs: pack > 0 ? Math.ceil(toOrder / pack - 1e-9) : null,
      supplier: supplier || NO_SUPPLIER, dishes: parts, portions: parts.reduce((a, p) => a + p.portions, 0),
      group: (set.groups || {})[name] || ruleGroup((db.ingredients || {})[name]), estimate: !!est[key],
      note: (set.notes || {})[name] || '', packInfo: (set.packInfo || {})[name] || '' };
  });
  const subs = Object.keys(cooked).map(name => {
    const y = yieldInfo(name, db, set, st), s = db.subs[name] || {};
    return { name, cooked: cooked[name], yield: y.value, source: y.source, why: y.why, dbYield: s.dbYield, input: s.input,
      batches: y.value > 0 ? cooked[name] / y.value : 0, usedIn: [...(usedIn[name] || [])] };
  });
  return { menus: wm.menus, onDay: wm.onDay, dishes, rows, subs, buf, portionsSum: dishes.reduce((a, d) => a + d.portions, 0) };
}

const at12 = d => { const x = new Date(d); x.setHours(12, 0, 0, 0); return x; };
const addDays = (d, n) => { const x = at12(d); x.setDate(x.getDate() + n); return x; };
const mondayOf = d => addDays(d, -((at12(d).getDay() + 6) % 7));
const iso = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const fromIso = s => at12(s + 'T12:00:00');
const day = d => d.toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' });

const weekNo = d => { const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate())); t.setUTCDate(t.getUTCDate() + 4 - (t.getUTCDay() || 7)); return Math.ceil(((t - Date.UTC(t.getUTCFullYear(), 0, 1)) / 864e5 + 1) / 7); };
const VIEWS = ['forecast', 'order', 'yields', 'checks'];

function weekOf(mon) {
  const days = [0, 1, 2, 3, 4].map(i => iso(addDays(mon, i)));
  return { mon, key: days[0], days, no: weekNo(mon), label: `${dm(mon)} – ${dm(addDays(mon, 4))}` };
}

// Delivery 1 (Tue 29 Sep) is for the first week that has an NRW menu. After that: the Friday before each week.
function firstServiceWeek() {
  let mon = mondayOf(fromIso(SET.firstDelivery));
  for (let i = 0; i < 12; i++, mon = addDays(mon, 7)) if (weekMenu(DB, weekOf(mon).days).ids.length) return mon;
  return mondayOf(fromIso(SET.firstDelivery));
}
function deliveriesFor(mon) {
  const first = fromIso(SET.firstDelivery), fri = addDays(mon, -3), out = [];
  if (iso(mon) === iso(FIRST_WEEK)) out.push({ date: first, label: `Delivery 1: ${day(first)}` });
  if (fri >= first && iso(fri) !== iso(first)) out.push({ date: fri, label: day(fri) });
  return out;
}
function deliveryLabel(dl) {
  if (!dl.length) return 'Before the first delivery';
  if (dl.length === 2) return `${dl[0].label}, then ${dl[1].label}`;
  return dl[0].label.startsWith('Delivery 1') ? dl[0].label : `Delivery: ${dl[0].label}`;
}

function defaultWeek() { // the next week that has an NRW menu and a delivery still to come
  const asked = new URLSearchParams(location.search).get('week');
  if (/^\d{4}-\d{2}-\d{2}$/.test(asked || '')) return mondayOf(fromIso(asked));
  const today = at12(new Date());
  let mon = mondayOf(today);
  for (let i = 0; i < 12; i++, mon = addDays(mon, 7)) {
    const dl = deliveriesFor(mon);
    if (dl.length && dl[dl.length - 1].date >= today && weekMenu(DB, weekOf(mon).days).ids.length) return mon;
  }
  return mondayOf(today);
}

function menuText(P) {
  if (!P.menus.length) return 'No NRW menu in the database for this week yet';
  return 'NRW menu: ' + P.menus.map(m => `${m.name} (${dm(fromIso(m.from))} – ${dm(fromIso(m.to))})`).join(', ');
}

    ${warn.length ? `<h2 class="h2">Recipe lines skipped</h2><ul class="checks">${warn.map(w => `<li>${esc(w)}</li>`).join('')}</ul>` : ''}
    <h2 class="h2">Where the numbers come from</h2>
    <p class="lead">NRW menus and recipes come from the BB database (${esc(stamp(DB.generated))}). ${LIVE ? 'GitHub refreshes data/db-snapshot.json every hour.' : 'This is the copy built into the page. On GitHub the page loads the hourly refresh.'} Portions are only what you type in the forecast.</p>
    <p class="lead">Forecasts, stock counts, suppliers, pack sizes, yields and the buffer are saved online in the team database (Firebase project <code>${esc((SET.firebase || {}).projectId || '')}</code>), shared live with everyone signed in. Nothing is written to the BB database or Apicbase.</p>`;
}

function download(name, text, type) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], { type }));
  a.download = name;
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 0);
}

async function refreshDB() {
  const btn = $('#refreshBtn');
  if (!btn) return;
  btn.setAttribute('aria-busy', 'true');
  btn.innerHTML = '<span class="spin">&#x21BB;</span> Fetching…';
  try {
    const res = await fetch('data/db-snapshot.json?t=' + Date.now(), { cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    DB = data; LIVE = true;
    FIRST_WEEK = firstServiceWeek();
    if (!weekMenu(DB, weekOf(WEEK).days).ids.length) WEEK = defaultWeek();
    render();
    const b2 = $('#refreshBtn');
    if (b2) { b2.innerHTML = '&#x2713; Updated'; setTimeout(() => { const b3 = $('#refreshBtn'); if (b3) { b3.setAttribute('aria-busy','false'); b3.innerHTML = '&#x21BB; Refresh DB'; } }, 2500); }
  } catch(e) {
    btn.setAttribute('aria-busy','false');
    btn.innerHTML = '&#x21BB; Refresh DB';
    showError('DB refresh failed: ' + e.message);
    setTimeout(() => showError(''), 4000);
  }
}

function loadXLSX() { // ponytail: Excel library loads only when someone downloads
  if (window.XLSX) return Promise.resolve(window.XLSX);
  return new Promise((ok, fail) => {
    const s = document.createElement('script');
    s.src = XLSX_URL; s.onload = () => ok(window.XLSX); s.onerror = () => fail(new Error('Excel library did not load'));
    document.head.appendChild(s);
  });
}

async function exportExcel() {
  let X;
  try { X = await loadXLSX(); } catch (e) { alert('The Excel tool could not load. Check the internet connection and try again.'); return; }
  const P = PLAN, order = [['Name', 'Qty', 'Unit']];
  const detail = [['Supplier', 'Item', 'Dish', 'Portions', 'Need', 'Unit', 'Stock on hand', 'To order', 'Pack size', 'Packs']];
  for (const [s, items] of bySupplier(P.rows)) for (const r of items) {
    order.push([r.name, q2(r.toOrder, r.unit), r.unit]);
    detail.push([s, r.name, 'All dishes', Math.round(r.portions), q2(r.need, r.unit), r.unit, r.stock, q2(r.toOrder, r.unit), r.pack > 0 ? r.pack : '', r.packs == null ? '' : r.packs]);
    for (const d of r.dishes) detail.push([s, r.name, d.name, Math.round(d.portions), q2(d.need, r.unit), r.unit]);
  }
  const wb = X.utils.book_new(), a = X.utils.aoa_to_sheet(order), b = X.utils.aoa_to_sheet(detail);
  a['!cols'] = [{ wch: 46 }, { wch: 10 }, { wch: 6 }];
  b['!cols'] = [{ wch: 22 }, { wch: 40 }, { wch: 48 }, { wch: 9 }, { wch: 9 }, { wch: 6 }, { wch: 13 }, { wch: 9 }, { wch: 9 }, { wch: 7 }];
  X.utils.book_append_sheet(wb, a, 'Order');
  X.utils.book_append_sheet(wb, b, 'By supplier and dish');
  X.writeFile(wb, `nrw-order-week${P.week.no}-${P.week.key}.xlsx`);
}

// ---------- team data: Firebase Realtime Database, shared live with everyone signed in ----------
// Paths under nrw-stock-planner/: forecast/{day}/{dishId}, stock/{monday}/{item}, suppliers/{item}, packs/{item},
// yields/{subRecipe}, settings/buffer, meta/lastChange. Item and sub-recipe names are encoded with enc().
async function firebaseStore(config) {
  if (!config || !config.databaseURL) throw new Error('Firebase settings are missing in data/kitchen-settings.json');
  const [app, A, D] = await Promise.all(['firebase-app.js', 'firebase-auth.js', 'firebase-database.js'].map(f => import(FB_SDK + f)));
  const fb = app.initializeApp(config), auth = A.getAuth(fb), db = D.getDatabase(fb);
  return {
    onAuth: cb => A.onAuthStateChanged(auth, cb),
    signIn: (email, pass) => A.signInWithEmailAndPassword(auth, email, pass),
    signUp: async (email, pass) => { const c = await A.createUserWithEmailAndPassword(auth, email, pass); await A.sendEmailVerification(c.user); },
    resend: () => A.sendEmailVerification(auth.currentUser),
    reset: email => A.sendPasswordResetEmail(auth, email),
    refresh: async () => { await auth.currentUser.reload(); await auth.currentUser.getIdToken(true); return auth.currentUser; },
    signOut: () => A.signOut(auth),
    listen: (cb, onErr) => D.onValue(D.ref(db, FB_ROOT), snap => cb(snap.val() || {}), onErr),
    connected: cb => D.onValue(D.ref(db, '.info/connected'), snap => cb(!!snap.val())),
    update: changes => D.update(D.ref(db, FB_ROOT), changes),
    now: () => D.serverTimestamp(),
  };
}

function applyRemote(data) {
  const decode = o => Object.fromEntries(Object.entries(o || {}).map(([k, v]) => [dec(k), v]));
  ST.fc = data.forecast || {};
  ST.stock = Object.fromEntries(Object.entries(data.stock || {}).map(([w, m]) => [w, decode(m)]));
  ST.suppliers = decode(data.suppliers); ST.packs = decode(data.packs); ST.yields = decode(data.yields);
  ST.buffer = data.settings && Number.isFinite(+data.settings.buffer) ? +data.settings.buffer : null;
  LAST = (data.meta && data.meta.lastChange) || null;
}
const cacheLoad = () => { try { const d = JSON.parse(localStorage.getItem(CACHE_KEY) || 'null'); if (d) applyRemote(d); } catch (e) { /* no copy yet */ } };
const cacheSave = d => { try { localStorage.setItem(CACHE_KEY, JSON.stringify(d)); } catch (e) { /* storage blocked */ } };

function put(changes, what) { // one save = one Firebase update (all paths at once), stamped with who and when
  if (!STORE || !USER) { showError('Sign in first. Nothing was saved.'); return; }
  changes['meta/lastChange'] = { by: USER.email, at: STORE.now(), what };
  Promise.resolve().then(() => STORE.update(changes)).catch(e => showError(`Not saved: ${e.message}`));
}

function migrateOld(data) { // numbers typed in this browser before the team database: offer to upload them once
  if (!OLD) return;
  const old = OLD; OLD = null; save();
  const remoteHas = ['forecast', 'stock', 'suppliers', 'packs', 'yields'].some(k => data[k] && Object.keys(data[k]).length);
  if (remoteHas || !confirm('This browser still has numbers typed before the team database (forecast, stock, suppliers, pack sizes or yields). Upload them for the whole team?')) return;
  const ch = {}, num = (path, v, min) => { if (v !== null && v !== '' && Number.isFinite(+v) && +v >= min) ch[path] = +v; };
  for (const [d, m] of Object.entries(old.fc || {})) for (const [id, v] of Object.entries(m || {})) num(`forecast/${d}/${id}`, v, 0);
  for (const [w, m] of Object.entries(old.stock || {})) {
    if (m && typeof m === 'object') for (const [it, v] of Object.entries(m)) num(`stock/${w}/${enc(it)}`, v, 0);
    else num(`stock/${iso(WEEK)}/${enc(w)}`, m, 0);
  }
  for (const [n, v] of Object.entries(old.suppliers || {})) ch[`suppliers/${enc(n)}`] = String(v).slice(0, 100);
  for (const [n, v] of Object.entries(old.packs || {})) num(`packs/${enc(n)}`, v, 0);
  for (const [n, v] of Object.entries(old.yields || {})) num(`yields/${enc(n)}`, v, 0.001);
  if (old.buffer != null && +old.buffer >= 0 && +old.buffer <= 1) ch['settings/buffer'] = +old.buffer;
  if (Object.keys(ch).length) put(ch, 'upload from browser');
}

const domain = () => String(SET.allowedEmailDomain || 'bellabona.com').toLowerCase();
function showError(msg) { const el = $('#appError'); el.hidden = !msg; el.textContent = msg || ''; }
const authMsg = (m, bad) => { const el = $('#authMsg'); el.textContent = m || ''; el.classList.toggle('warn', !!bad); };
const friendly = e => ({
  'auth/invalid-credential': 'Wrong email or password.', 'auth/invalid-login-credentials': 'Wrong email or password.',
  'auth/wrong-password': 'Wrong email or password.', 'auth/user-not-found': 'No account with this email yet. Use Create account.',
  'auth/email-already-in-use': 'This email already has an account. Sign in, or use Forgot password.',
  'auth/weak-password': 'Use at least 6 characters for the password.', 'auth/invalid-email': 'This email address is not valid.',
  'auth/too-many-requests': 'Too many tries. Wait a few minutes or use Forgot password.', 'auth/network-request-failed': 'No internet connection.',
  'auth/operation-not-allowed': 'Email sign-in is not switched on in Firebase yet (Authentication > Sign-in method > Email/Password).',
}[e && e.code] || (e && e.message) || String(e));

function renderStatus() {
  const when = t => new Date(t).toLocaleString('en-GB', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
  $('#userEmail').textContent = USER ? USER.email : '';
  $('#signOut').hidden = !USER;
  $('#status').textContent = !USER ? '' : CONNECTED === false ? 'Offline: changes are saved when you are back online.'
    : CONNECTED ? `Saved online${LAST && LAST.by ? `. Last change: ${LAST.by.split('@')[0]}, ${when(LAST.at)}.` : '.'}` : 'Connecting…';
}
function showAuth(mode) {
  $('#app').hidden = true; $('#auth').hidden = false;
  $('#authForm').hidden = mode !== 'signin'; $('#verifyBox').hidden = mode !== 'verify';
  for (const el of document.querySelectorAll('.domain')) el.textContent = '@' + domain();
  if (mode === 'verify') $('#verifyEmail').textContent = USER.email;
  renderStatus();
}
function onAuth(user) {
  USER = user;
  if (UNSUB) { UNSUB(); UNSUB = null; }
  if (!user) { // signed out: forget the team data on this device
    for (const k of ['fc', 'stock', 'suppliers', 'packs', 'yields', 'buffer']) delete ST[k];
    LAST = null;
    try { localStorage.removeItem(CACHE_KEY); } catch (e) { /* storage blocked */ }
    return showAuth('signin');
  }
  if (!user.emailVerified) return showAuth('verify');
  showError(''); authMsg('');
  $('#auth').hidden = true; $('#app').hidden = false;
  render();
  let first = true;
  UNSUB = STORE.listen(data => {
    applyRemote(data); cacheSave(data);
    if (first) { first = false; migrateOld(data); }
    renderStatus(); renderFromRemote();
  }, e => showError(`No access to the team data (${e.message}). Sign in with a verified @${domain()} email, and check the database rules.`));
}

let pending = false;
function rerenderSoon() { // wait for focus to move, then re-render and put the cursor back
  if (pending) return;
  pending = true;
  setTimeout(() => {
    pending = false;
    if ($('#app').hidden) return;
    const a = document.activeElement;
    if (a && a.closest && a.closest('#app') && a.tagName === 'INPUT' && a.value !== a.defaultValue) { REMOTE_PENDING = true; return; } // mid-typing: wait until the field is left
    const fid = a && a.dataset ? a.dataset.fid : null;
    render();
    const el = fid && document.querySelector(`[data-fid="${CSS.escape(fid)}"]`);
    if (el) el.focus();
  }, 0);
}
function renderFromRemote() { // someone else changed something: don't wipe a number while it is being typed
  const a = document.activeElement;
  if (a && a.closest && a.closest('#app') && /^(INPUT|SELECT)$/.test(a.tagName)) { REMOTE_PENDING = true; return; }
  rerenderSoon();
}
document.addEventListener('focusout', () => { if (REMOTE_PENDING) { REMOTE_PENDING = false; rerenderSoon(); } });

document.addEventListener('change', e => {
  const el = e.target, d = el.dataset;
  if (!el.closest('#app')) return;
  const val = el.value === '' || !Number.isFinite(+el.value) || +el.value < 0 ? null : +el.value;
  const wk = PLAN.week.key;
  if ('fc' in d) { const [dayIso, id] = d.fc.split('|'); put({ [`forecast/${dayIso}/${id}`]: val }, 'forecast'); }
  else if ('fill' in d) {
    const x = PLAN.dishes.find(t => t.id === d.fill), ch = {};
    if (x) x.perDay.forEach((v, j) => { if (v !== null) ch[`forecast/${PLAN.week.days[j]}/${d.fill}`] = val; });
    put(ch, 'forecast');
  }
  else if ('stock' in d) put({ [`stock/${wk}/${enc(d.stock)}`]: val }, 'stock count');
  else if ('pack' in d) put({ [`packs/${enc(d.pack)}`]: val === null ? 0 : val }, 'pack size');
  else if ('sup' in d) put({ [`suppliers/${enc(d.sup)}`]: el.value }, 'supplier');
  else if ('yield' in d) put({ [`yields/${enc(d.yield)}`]: val > 0 ? val : null }, 'yield');
  else if (el.id === 'sBuffer') put({ 'settings/buffer': val === null ? null : Math.min(1, val / 100) }, 'buffer');
  else if (el.id === 'showDishes') { ST.showDishes = el.checked; save(); }
  else return;
  rerenderSoon();
});

document.addEventListener('click', e => {
  const b = e.target.closest('button');
  if (!b) return;
  if (b.dataset.tab) { ST.view = b.dataset.tab; STOCK_EDIT = false; save(); render(); }
  else if (b.dataset.step) { WEEK = addDays(WEEK, +b.dataset.step); STOCK_EDIT = false; render(); }
  else if (b.dataset.goto) { WEEK = mondayOf(fromIso(b.dataset.goto)); STOCK_EDIT = false; render(); }
  else if (b.id === 'stockEditBtn') { STOCK_EDIT = !STOCK_EDIT; renderOrder(); if (STOCK_EDIT) { const f = document.querySelector('input[data-stock]'); if (f) f.focus(); } }
  else if (b.dataset.confirm) { const s = PLAN.subs.find(x => x.name === b.dataset.confirm); if (s) put({ [`yields/${enc(s.name)}`]: s.yield }, 'yield'); rerenderSoon(); }
  else if (b.id === 'refreshBtn') refreshDB();
  else if (b.id === 'xlsxBtn') exportExcel();
  else if (b.id === 'printBtn') { ST.view = 'order'; render(); window.print(); }
  else if (b.id === 'clearWeek' && confirm(`Clear the forecast for ${PLAN.week.label}? This clears it for the whole team.`)) {
    const ch = {}; for (const d of PLAN.week.days) ch[`forecast/${d}`] = null; put(ch, 'forecast cleared'); rerenderSoon();
  }
  else if (b.id === 'signOut') STORE.signOut();
  else if (b.id === 'aSignup') {
    const c = creds(); if (!c) return;
    if (c.pass.length < 6) { authMsg('Use at least 6 characters for the password.', true); return; }
    authMsg('Creating the account…');
    STORE.signUp(c.email, c.pass).then(() => authMsg('')).catch(err => authMsg(friendly(err), true));
  }
  else if (b.id === 'aReset') {
    const email = $('#aEmail').value.trim().toLowerCase();
    if (!email) { authMsg('Type your email first.', true); return; }
    STORE.reset(email).then(() => authMsg(`If ${email} has an account, a reset link is on its way.`)).catch(err => authMsg(friendly(err), true));
  }
  else if (b.id === 'vContinue') STORE.refresh().then(u => u.emailVerified ? onAuth(u) : authMsg('Not verified yet. Click the link in the email first.', true)).catch(err => authMsg(friendly(err), true));
  else if (b.id === 'vResend') STORE.resend().then(() => authMsg('Sent again. Check the inbox and the spam folder.')).catch(err => authMsg(friendly(err), true));
});

function creds() {
  const email = $('#aEmail').value.trim().toLowerCase(), pass = $('#aPass').value;
  if (!email.endsWith('@' + domain())) { authMsg(`Use your @${domain()} email.`, true); return null; }
  return { email, pass };
}
$('#authForm').addEventListener('submit', e => {
  e.preventDefault();
  const c = creds(); if (!c) return;
  authMsg('Signing in…');
  STORE.signIn(c.email, c.pass).then(() => authMsg('')).catch(err => authMsg(friendly(err), true));
});
$('#search').addEventListener('input', e => { SEARCH = e.target.value; renderOrder(); });
document.addEventListener('wheel', e => { const a = document.activeElement; if (a && a.type === 'number' && e.target === a) a.blur(); }, { passive: true }); // scrolling never changes a number

async function loadJSON(path, seedId) {
  try {
    const r = await fetch(path, { cache: 'no-store' });
    if (r.ok) return { data: await r.json(), live: true };
  } catch (e) { /* opened as a file or offline: use the built-in copy */ }
  const seed = JSON.parse(document.getElementById(seedId).textContent);
  if (!seed) throw new Error(`${path} could not be loaded`);
  return { data: seed, live: false };
}

(async () => {
  try {
    const [a, b] = await Promise.all([loadJSON('data/db-snapshot.json', 'seedDb'), loadJSON('data/kitchen-settings.json', 'seedSettings')]);
    DB = a.data; SET = b.data; LIVE = a.live;
    FIRST_WEEK = firstServiceWeek();
    WEEK = defaultWeek();
    cacheLoad(); // last copy of the team data, so the page shows numbers at once
    $('#status').textContent = 'Connecting…';
    STORE = window.__STORE__ || await firebaseStore(SET.firebase);
    STORE.connected(on => { CONNECTED = on; renderStatus(); });
    STORE.onAuth(onAuth);
  } catch (e) {
    showError(`The planner could not start (${e.message}). Check the internet connection and reload with Ctrl+F5.`);
  }
})();
</script>
